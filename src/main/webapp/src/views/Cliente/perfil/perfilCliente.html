<section class="perfil-cliente-seccion" style="padding: 30px 20px; max-width: 600px; margin: 0 auto; background: #fff; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-top: 20px;">
    <div class="perfil-header" style="margin-bottom: 25px; border-bottom: 2px solid #f4f4f4; padding-bottom: 15px;">
        <h2 style="color: #212529; margin: 0; font-size: 1.5rem;">mi perfil de envio</h2>
        <p style="color: #6c757d; font-size: 0.9rem; margin-top: 5px;">aqui puedes ver tu informacion actual. para modificarla, ve a configuracion.</p>
    </div>
    
    <div class="perfil-info" style="display: flex; flex-direction: column; gap: 18px;">
        <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
            <strong style="color: #495057; font-size: 0.9rem;">telefono de contacto</strong>
            <span id="txt-telefono" style="padding: 10px; background: #f8f9fa; border-radius: 6px; color: #212529;">no configurado</span>
        </div>
        
        <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
            <strong style="color: #495057; font-size: 0.9rem;">telefono alternativo</strong>
            <span id="txt-telefono-sec" style="padding: 10px; background: #f8f9fa; border-radius: 6px; color: #212529;">no configurado</span>
        </div>

        <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
            <strong style="color: #495057; font-size: 0.9rem;">direccion principal</strong>
            <span id="txt-direccion" style="padding: 10px; background: #f8f9fa; border-radius: 6px; color: #212529;">no configurado</span>
        </div>
        
        <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
            <strong style="color: #495057; font-size: 0.9rem;">detalle de direccion</strong>
            <span id="txt-detalle" style="padding: 10px; background: #f8f9fa; border-radius: 6px; color: #212529;">no configurado</span>
        </div>
        
        <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
            <strong style="color: #495057; font-size: 0.9rem;">referencia de ubicacion</strong>
            <span id="txt-referencia" style="padding: 10px; background: #f8f9fa; border-radius: 6px; color: #212529;">no configurado</span>
        </div>
    </div>
</section>
