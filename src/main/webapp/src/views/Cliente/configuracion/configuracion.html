<section class="configuracion-view" style="padding: 30px 20px; max-width: 900px; margin: 0 auto;">
    <h2 style="margin-bottom: 30px; color: #212529; border-bottom: 2px solid #f4f4f4; padding-bottom: 10px;">configuracion de la cuenta</h2>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
        <!-- bloque de edicion de perfil -->
        <div style="background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <h3 style="margin-bottom: 20px; color: #333; font-size: 1.2rem;">datos de envio y contacto</h3>
            <form id="form-config-perfil" style="display: flex; flex-direction: column; gap: 15px;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="conf-telefono" style="font-weight: 600; font-size: 0.9rem;">telefono principal</label>
                    <input type="text" id="conf-telefono" required placeholder="ej. 3100000000" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="conf-telefono-sec" style="font-weight: 600; font-size: 0.9rem;">telefono alternativo</label>
                    <input type="text" id="conf-telefono-sec" placeholder="ej. 3200000000" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="conf-direccion" style="font-weight: 600; font-size: 0.9rem;">direccion de entrega</label>
                    <input type="text" id="conf-direccion" required placeholder="ej. calle 10 # 5-20" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="conf-detalle" style="font-weight: 600; font-size: 0.9rem;">detalle (torre, apto)</label>
                    <input type="text" id="conf-detalle" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="conf-referencia" style="font-weight: 600; font-size: 0.9rem;">referencia de ubicacion</label>
                    <textarea id="conf-referencia" rows="2" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;"></textarea>
                </div>
                <button type="submit" style="background: #212529; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: background 0.3s;">
                    guardar informacion
                </button>
            </form>
        </div>

        <!-- bloque de seguridad -->
        <div style="background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); height: fit-content;">
            <h3 style="margin-bottom: 20px; color: #dc3545; font-size: 1.2rem;"><i class='bx bx-lock-alt'></i> cambiar contrasena</h3>
            <form id="form-cambiar-password" style="display: flex; flex-direction: column; gap: 15px;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: 600; font-size: 0.9rem;">contrasena actual</label>
                    <input type="password" id="pass-actual" required placeholder="digita tu contrasena actual" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: 600; font-size: 0.9rem;">nueva contrasena</label>
                    <input type="password" id="pass-nueva" required placeholder="escribe tu nueva contrasena" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: 600; font-size: 0.9rem;">confirmar contrasena</label>
                    <input type="password" id="pass-confirm" required placeholder="repite tu nueva contrasena" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <button type="submit" style="background: #dc3545; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: background 0.3s;">
                    actualizar contrasena
                </button>
            </form>
        </div>
    </div>
</section>
