<section class="configuracion-view" style="padding: 30px 20px; max-width: 600px; margin: 0 auto; box-sizing: border-box;">
    <h2 style="margin-bottom: 30px; color: #212529; border-bottom: 2px solid #f4f4f4; padding-bottom: 10px;">Configuración de la cuenta</h2>
    
    <div style="display: flex; flex-direction: column; gap: 30px;">
        <!-- bloque de edicion de perfil -->
        <div style="background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <h3 style="margin-bottom: 20px; color: #333; font-size: 1.2rem;">Datos de envío y contacto</h3>
            <form id="form-config-perfil" style="display: flex; flex-direction: column; gap: 15px;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="conf-telefono" style="font-weight: 600; font-size: 0.9rem;">Teléfono principal</label>
                    <input type="text" id="conf-telefono" required placeholder="Ej. 3100000000" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="conf-telefono-sec" style="font-weight: 600; font-size: 0.9rem;">Teléfono alternativo</label>
                    <input type="text" id="conf-telefono-sec" placeholder="Ej. 3200000000" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="conf-direccion" style="font-weight: 600; font-size: 0.9rem;">Dirección de entrega</label>
                    <input type="text" id="conf-direccion" required placeholder="Ej. Calle 10 # 5-20" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="conf-detalle" style="font-weight: 600; font-size: 0.9rem;">Detalle (torre, apto)</label>
                    <input type="text" id="conf-detalle" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="conf-referencia" style="font-weight: 600; font-size: 0.9rem;">Referencia de ubicación</label>
                    <textarea id="conf-referencia" rows="2" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;"></textarea>
                </div>
                <button type="submit" style="background: #212529; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: background 0.3s;">
                    Guardar información
                </button>
            </form>
        </div>

        <!-- bloque de seguridad -->
        <div style="background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); height: fit-content;">
            <h3 style="margin-bottom: 20px; color: #333; font-size: 1.2rem;"><i class='bx bx-lock-alt'></i> Cambiar contraseña</h3>
            <form id="form-cambiar-password" style="display: flex; flex-direction: column; gap: 15px;">
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: 600; font-size: 0.9rem;">Contraseña actual</label>
                    <input type="password" id="pass-actual" required placeholder="Digita tu contraseña actual" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: 600; font-size: 0.9rem;">Nueva contraseña</label>
                    <input type="password" id="pass-nueva" required placeholder="Escribe tu nueva contraseña" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label style="font-weight: 600; font-size: 0.9rem;">Confirmar contraseña</label>
                    <input type="password" id="pass-confirm" required placeholder="Repite tu nueva contraseña" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <button type="submit" style="background: #212529; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: background 0.3s;">
                    Actualizar contraseña
                </button>
            </form>
        </div>
    </div>
</section>
