<section class="configuracion-view">
    <div class="configuracion-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px;">
        <h2>Mi Cuenta</h2>
        <button id="btn-ir-historial" style="background-color: #000; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">Ver mis pedidos</button>
    </div>
    
    <div class="configuracion-contenido" style="padding-top: 10px;">
        <div id="contenido-perfil">
            <h3 style="margin-bottom: 20px; color: #333;">Datos de Envio</h3>
            <form id="form-perfil-cliente" class="formulario-perfil" style="max-width: 500px;">
                <div class="grupo-form-perfil" style="margin-bottom: 15px; display: flex; flex-direction: column;">
                    <label for="cli-direccion" style="margin-bottom: 5px; font-weight: bold; color: #555;">Direccion de Entrega</label>
                    <input type="text" id="cli-direccion" name="direccion" placeholder="Ej: Calle 10 # 5-20, Giron" required style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none;">
                </div>
                <div class="grupo-form-perfil" style="margin-bottom: 15px; display: flex; flex-direction: column;">
                    <label for="cli-telefono" style="margin-bottom: 5px; font-weight: bold; color: #555;">Telefono de Contacto</label>
                    <input type="tel" id="cli-telefono" name="telefono" placeholder="Ej: 3001234567" required style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none;">
                </div>
                <div class="grupo-form-perfil" style="margin-bottom: 25px; display: flex; flex-direction: column;">
                    <label for="cli-referencia" style="margin-bottom: 5px; font-weight: bold; color: #555;">Detalles adicionales (Opcional)</label>
                    <input type="text" id="cli-referencia" name="referencia" placeholder="Ej: Casa blanca esquinera, frente al parque" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none;">
                </div>
                <button type="submit" class="btn-guardar-perfil" style="background-color: #000; color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.3s;">Guardar Cambios</button>
            </form>
        </div>
    </div>
</section>
