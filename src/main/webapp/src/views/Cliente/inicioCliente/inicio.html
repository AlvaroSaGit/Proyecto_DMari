<div class="container-inicio">
    <!-- novedades de la tienda -->
    <section class="novedades">
        <div class="novedades-contenido">
            <h1>¡Descubre lo mas nuevo de DMari!</h1>
            <div class="novedades-etiqueta">
                <div class="etiqueta">Regalos</div>
                <div class="etiqueta">Ofertas</div>
                <div class="etiqueta">Nuevos</div>
            </div>
        </div>
    </section>
    
    <!-- vitrina de reposteria -->
    <section class="donas categoria-seccion">
        <h1>Reposteria deliciosa</h1>
        <!-- aqui javascript inyectara las donas y postres -->
        <div id="contenedor-reposteria" class="producto-grid"></div>
    </section>

    <!-- vitrina de decoracion -->
    <section class="velas categoria-seccion">
        <h1>Decoracion y hogar</h1>
        <!-- aqui javascript inyectara las velas y accesorios -->
        <div id="contenedor-decoracion" class="producto-grid"></div>
    </section>

    <!-- vitrina de floristeria -->
    <section class="destacados categoria-seccion">
        <h1>Arreglos florales</h1>
        <!-- aqui javascript inyectara las rosas y ramos -->
        <div id="contenedor-floristeria" class="producto-grid"></div>
    </section>

    <!-- contenedor general para respaldo o para busquedas en el futuro -->
    <section class="destacados">
        <div id="contenedor-producto" class="producto-grid" style="margin-top: 40px;">
            <!-- javascript inyectara los productos aqui si los contenedores anteriores fallan o si se hace una busqueda -->
        </div>
    </section>
</div>
