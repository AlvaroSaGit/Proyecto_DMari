<div class="contenedor-registro">
    <form class="formulario-registro">
        <h2>crear cuenta</h2>
        <p>registrate para comprar tus donas y velas favoritas</p>

        <div class="grupo-entrada">
            <label>nombre completo</label>
            <input type="text" id="reg-nombre" placeholder="ej: juan perez">
        </div>

        <div class="grupo-entrada">
            <label>correo electronico</label>
            <input type="email" id="reg-correo" placeholder="usuario@gmail.com">
        </div>

        <div class="grupo-entrada">
            <label>contraseña</label>
            <input type="password" id="reg-password" placeholder="********">
        </div>

        <button type="submit" class="btn-registro">registrarse</button>
        
        <p class="footer-form">¿ya tienes cuenta? <a href="#" id="link-ir-login">inicia sesion</a></p>
    </form>
</div>
