<!-- VISTA PRINCIPAL DE PRODUCTOS DEL PROVEEDOR -->
<section class="admin-vista-productos">
    <div class="admin-header-seccion">
        <h2>mis productos</h2>
        <div style="display:flex; gap:10px;">
            <button id="btn-sugerir-categoria" style="background:#e7a052; color:white; border:none; padding:10px 15px; border-radius:5px; cursor:pointer; font-weight:bold;"><i class='bx bx-bulb'></i> Sugerir Categoria</button>
            <button id="btn-nuevo-producto-prov" class="btn-nuevo-prod"><i class='bx bx-plus'></i> Nuevo Producto</button>
        </div>
    </div>
    
    <div class="admin-tabla-contenedor">
        <table class="tabla-admin">
            <thead>
                <tr>
                    <th>id</th>
                    <th>imagen</th>
                    <th>nombre</th>
                    <th>precio</th>
                    <th>estado</th>
                    <th>acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-productos-prov-body">
                <tr><td colspan="6" style="text-align:center;">cargando mis productos...</td></tr>
            </tbody>
        </table>
    </div>
</section>

<!-- MODAL (VENTANA EMERGENTE) PARA CREAR O EDITAR PRODUCTOS DEL PROVEEDOR -->
<div id="modal-producto-prov" class="modal-admin oculto">
    <div class="modal-contenido">
        <div class="modal-header">
            <h3 id="modal-titulo-prov">Nuevo Producto</h3>
            <button id="btn-cerrar-modal-prov" class="btn-cerrar">&times;</button>
        </div>
        <div class="modal-body">
            <form id="form-producto-prov" class="admin-form">
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-nombre-prov">Nombre del producto</label>
                    <input class="admin-form__input" type="text" id="prod-nombre-prov" name="nombre" required>
                </div>
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-descripcion-prov">Descripcion</label>
                    <textarea class="admin-form__input" id="prod-descripcion-prov" name="descripcion" rows="3" placeholder="Detalles del producto..."></textarea>
                </div>
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-categoria-prov">Categoria</label>
                    <select class="admin-form__input" id="prod-categoria-prov" name="id_categoria" required>
                    </select>
                </div>
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-precio-prov">Precio</label>
                    <input class="admin-form__input" type="number" id="prod-precio-prov" name="precio" step="0.01" required>
                </div>
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-stock-prov">Stock</label>
                    <input class="admin-form__input" type="number" id="prod-stock-prov" name="stock" required>
                </div>
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-etiquetas-prov">Etiquetas (separadas por coma)</label>
                    <input class="admin-form__input" type="text" id="prod-etiquetas-prov" name="etiquetas" placeholder="Ej: Aromaterapia, Dulce">
                </div>
                <!-- AQUI OMITIMOS EL SELECT DEL PROVEEDOR, YA QUE JAVA LO ASIGNA AUTOMATICAMENTE POR SESION -->
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-imagen-prov">Imagen del producto</label>
                    <div id="contenedor-preview-prov" style="display: none; margin-bottom: 10px; text-align: center; background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px dashed #ccc;">
                        <img id="prod-imagen-preview-prov" src="" alt="Previsualizacion" onerror="this.onerror=null; this.src='src/img/productos/default/gato_programador.jpg';" style="max-width: 100%; max-height: 150px; border-radius: 6px; object-fit: contain;">
                    </div>
                    <input class="admin-form__input" type="file" id="prod-imagen-prov" name="imagen" accept="image/png, image/jpeg, image/webp" required>
                </div>
                <div class="admin-form__actions">
                    <button type="button" id="btn-cancelar-modal-prov" class="admin-form__btn admin-form__btn--secondary">Cancelar</button>
                    <button type="submit" class="admin-form__btn admin-form__btn--primary">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>
</div>
