<!-- 
  VISTA DE PRODUCTOS DEL PROVEEDOR
-->
<section class="proveedor-vista-productos">
    <div class="proveedor-header-seccion">
        <h2>mis productos</h2>
        <button id="btn-nuevo-producto" class="btn-nuevo-prod"><i class='bx bx-plus'></i> Nuevo Producto</button>
    </div>
    
    <div class="proveedor-tabla-contenedor">
        <table class="tabla-proveedor">
            <thead>
                <tr>
                    <th>id</th>
                    <th>imagen</th>
                    <th>nombre</th>
                    <th>precio</th>
                    <th>stock</th>
                    <th>estado</th>
                    <th>acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-prov-productos-body">
                <tr><td colspan="7" style="text-align:center;">cargando mis productos...</td></tr>
            </tbody>
        </table>
    </div>
</section>

<!-- 
  ===================================================================
  MODAL (VENTANA EMERGENTE) PARA CREAR O EDITAR PRODUCTOS
  ===================================================================
-->
<div id="modal-producto" class="modal-admin oculto">
    <div class="modal-contenido">
        <div class="modal-header">
            <h3 id="modal-titulo">Nuevo Producto</h3>
            <button id="btn-cerrar-modal" class="btn-cerrar">&times;</button>
        </div>
        <div class="modal-body">
            <form id="form-producto" class="admin-form">
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-nombre">Nombre del producto</label>
                    <input class="admin-form__input" type="text" id="prod-nombre" name="nombre" required>
                </div>
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-descripcion">Descripcion</label>
                    <textarea class="admin-form__input" id="prod-descripcion" name="descripcion" rows="3" placeholder="Detalles del producto..."></textarea>
                </div>
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-categoria">Categoria</label>
                    <!-- Este select se llenara dinamicamente usando Fetch -->
                    <select class="admin-form__input" id="prod-categoria" name="id_categoria" required>
                    </select>
                </div>
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-precio">Precio</label>
                    <input class="admin-form__input" type="number" id="prod-precio" name="precio" step="0.01" required>
                </div>
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-stock">Stock</label>
                    <input class="admin-form__input" type="number" id="prod-stock" name="stock" required>
                </div>
                <div class="admin-form__group">
                    <label class="admin-form__label" for="prod-imagen">Imagen del producto</label>
                    <div id="contenedor-preview" style="display: none; margin-bottom: 10px; text-align: center; background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px dashed #ccc;">
                        <img id="prod-imagen-preview" src="" alt="Previsualizacion" style="max-width: 100%; max-height: 150px; border-radius: 6px; object-fit: contain;">
                    </div>
                    <input class="admin-form__input" type="file" id="prod-imagen" name="imagen" accept="image/png, image/jpeg, image/webp" required>
                </div>
                <div class="admin-form__actions">
                    <button type="button" id="btn-cancelar-modal" class="admin-form__btn admin-form__btn--secondary">Cancelar</button>
                    <button type="submit" class="admin-form__btn admin-form__btn--primary">Guardar Producto</button>
                </div>
                <div id="admin-form-mensaje" class="admin-form__message"></div>
            </form>
        </div>
    </div>
</div>
