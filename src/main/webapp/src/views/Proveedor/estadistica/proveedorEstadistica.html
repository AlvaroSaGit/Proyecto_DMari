<!-- vista de rendimiento comercial para el proveedor -->
<section class="admin-vista-productos">
    <div class="admin-header-seccion">
        <h2>mi rendimiento comercial</h2>
    </div>
    
    <!-- resumen de ganancias propias -->
    <div class="admin-tabla-contenedor" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; background: transparent; border: none;">
        <div class="stat-card" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border-bottom: 4px solid #d4a373;">
            <i class='bx bx-trending-up' style="font-size: 2.5rem; color: #d4a373;"></i>
            <h3 style="margin: 10px 0; font-size: 1rem; color: #666;">mis ingresos netos</h3>
            <p id="prov-ingresos" style="font-size: 1.8rem; font-weight: bold; color: #333;">$0.00</p>
        </div>
        <div class="stat-card" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border-bottom: 4px solid #d4a373;">
            <i class='bx bx-cart-alt' style="font-size: 2.5rem; color: #d4a373;"></i>
            <h3 style="margin: 10px 0; font-size: 1rem; color: #666;">mis ventas logradas</h3>
            <p id="prov-pedidos" style="font-size: 1.8rem; font-weight: bold; color: #333;">0</p>
        </div>
        <div class="stat-card" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border-bottom: 4px solid #d4a373;">
            <i class='bx bx-purchase-tag' style="font-size: 2.5rem; color: #d4a373;"></i>
            <h3 style="margin: 10px 0; font-size: 1rem; color: #666;">unidades despachadas</h3>
            <p id="prov-productos" style="font-size: 1.8rem; font-weight: bold; color: #333;">0</p>
        </div>
    </div>
</section>
