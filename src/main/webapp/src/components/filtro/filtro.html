<!-- componente de filtro para el catalogo -->
<!-- panel de filtros avanzados -->
<div class="catalogo-filtros-avanzados">
    
    <!-- bloque 1: categorias -->
    <div class="filtro-grupo">
        <h3>Categoria</h3>
        <div class="opciones-filtro" id="contenedor-categorias-filtro">
            <p style="font-size: 0.8rem; color: #888;">Cargando categorías...</p>
        </div>
    </div>

    <!-- bloque 2: etiquetas (tematicas) -->
    <div class="filtro-grupo">
        <h3>Tematica</h3>
        <div class="opciones-filtro" id="contenedor-etiquetas-filtro">
            <p style="font-size: 0.8rem; color: #888;">Cargando temáticas...</p>
        </div>
    </div>

    <!-- bloque 3: rango de precios -->
    <div class="filtro-grupo">
        <h3>Precio (Min - Max)</h3>
        <div class="opciones-precio">
            <input type="number" id="precio-min" placeholder="Mín" class="input-precio">
            <span>-</span>
            <input type="number" id="precio-max" placeholder="Máx" class="input-precio">
            <button class="btn-filtro btn-buscar-precio">Filtrar</button>
        </div>
    </div>

    <!-- bloque 4: ordenar por -->
    <div class="filtro-grupo" style="margin-top: 20px;">
        <h3>Ordenar por</h3>
        <select id="select-ordenar" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 10px;">
            <option value="relevancia">Relevancia (Por defecto)</option>
            <option value="precio-asc">Precio: Menor a Mayor</option>
            <option value="precio-desc">Precio: Mayor a Menor</option>
            <option value="nombre-asc">Nombre: A - Z</option>
            <option value="nombre-desc">Nombre: Z - A</option>
        </select>
    </div>
</div>
