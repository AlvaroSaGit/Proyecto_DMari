<!-- componente de filtro para el catalogo -->
<!-- panel de filtros avanzados -->
<div class="catalogo-filtros-avanzados">
    
    <!-- bloque 1: categorias -->
    <div class="filtro-grupo">
        <h3>Categoría</h3>
        <div class="opciones-filtro">
            <button class="btn-filtro activo">Todas</button>
            <button class="btn-filtro">Donas</button>
            <button class="btn-filtro">Ramos</button>
            <button class="btn-filtro">Velas</button>
        </div>
    </div>

    <!-- bloque 2: etiquetas (tematicas) -->
    <div class="filtro-grupo">
        <h3>Temática</h3>
        <div class="opciones-filtro">
            <button class="btn-filtro">Día de las Madres</button>
            <button class="btn-filtro">Halloween</button>
            <button class="btn-filtro">Navidad</button>
        </div>
    </div>

    <!-- bloque 3: rango de precios -->
    <div class="filtro-grupo">
        <h3>Precio (Min - Max)</h3>
        <div class="opciones-precio">
            <input type="number" id="precio-min" placeholder="Mín" class="input-precio">
            <span>-</span>
            <input type="number" id="precio-max" placeholder="Máx" class="input-precio">
            <button class="btn-filtro btn-buscar-precio">Filtrar</button>
        </div>
    </div>
</div>
